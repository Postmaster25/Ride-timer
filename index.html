<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ride Timer">
<meta name="theme-color" content="#000000">
<title>Ride Timer Prototype</title>
<style>
  :root {
    --bg: #000; --panel: #141414; --line: #2a2a2a; --text: #fff; --muted: #9a9a9a;
    --accent: #ffcc00; --go: #2ecc71; --stop: #ff4d4d; --work: #ff7a1a; --rest: #3da5ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px); }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 16px 0 4px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 8px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  label.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }
  select, textarea { font: inherit; color: var(--text); background: #000; border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  select { max-width: 60%; }
  input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--accent); }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 14px; padding: 14px 16px; color: #000; background: var(--accent); cursor: pointer; touch-action: manipulation; }
  button.secondary { background: #2a2a2a; color: var(--text); }
  button.danger { background: var(--stop); color: #000; }
  button:disabled { opacity: .35; }
  .big { width: 100%; font-size: 22px; padding: 20px; }
  .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 12px; }

  #timer { text-align: center; padding: 18px 14px; }
  #stepName { font-size: 28px; font-weight: 700; }
  #stepName.work { color: var(--work); } #stepName.recovery, #stepName.cooldown, #stepName.warmup { color: var(--rest); }
  #rep { font-size: 20px; color: var(--muted); min-height: 1.4em; }
  #clock { font-size: 96px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.05; margin: 6px 0; }
  #target { font-size: 30px; font-weight: 700; }
  #next { color: var(--muted); margin-top: 8px; }
  .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; margin-top: 12px; font-variant-numeric: tabular-nums; }
  #status { font-size: 14px; color: var(--muted); margin-top: 10px; }
  #status b { color: var(--text); font-weight: 600; }

  #log { list-style: none; margin: 0; padding: 0; font-size: 14px; font-variant-numeric: tabular-nums; max-height: 220px; overflow: auto; }
  #log li { display: flex; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  #log .t { color: var(--muted); width: 3.2em; flex: none; }
  #log .s { margin-left: auto; color: var(--muted); flex: none; }
  #log .bad { color: var(--stop); }

  .check { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .check:last-of-type { border-bottom: 0; }
  .check .n { color: var(--muted); width: 1.2em; flex: none; }
  .check .q { flex: 1; }
  .check .q small { display: block; color: var(--muted); font-size: 13px; }
  .seg { display: flex; flex: none; }
  .seg button { padding: 8px 10px; border-radius: 0; background: #2a2a2a; color: var(--text); font-size: 14px; }
  .seg button:first-child { border-radius: 10px 0 0 10px; } .seg button:last-child { border-radius: 0 10px 10px 0; }
  .seg button.on.pass { background: var(--go); color: #000; } .seg button.on.fail { background: var(--stop); color: #000; }
  textarea { width: 100%; min-height: 70px; margin-top: 10px; }
  .actions { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }

  #lockOverlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; z-index: 10;
    align-items: flex-end; justify-content: center; padding-bottom: calc(env(safe-area-inset-bottom) + 40px);
    touch-action: none; -webkit-user-select: none; user-select: none; }
  #lockOverlay.on { display: flex; }
  #unlock { position: relative; overflow: hidden; background: #2a2a2a; color: var(--text); width: min(80vw, 360px); padding: 22px; font-size: 20px; -webkit-touch-callout: none; }
  #unlock span { position: relative; }
  #unlockFill { position: absolute; inset: 0; width: 0; background: var(--accent); opacity: .5; }
  video.hidden { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; left: 0; top: 0; }
</style>
</head>
<body>
<main>
  <h1>Ride Timer: voice prototype</h1>
  <p class="sub">Phase 1. Tests spoken cues, keep-awake and timing on the iPhone.</p>

  <div class="panel" id="setup">
    <label class="row">Workout
      <select id="workout"></select>
    </label>
    <label class="row">Voice
      <select id="engine">
        <option value="speech">Built-in speech</option>
        <option value="clips">Recorded clips</option>
      </select>
    </label>
    <label class="row">Keep screen awake <input type="checkbox" id="keepAwake" checked></label>
    <label class="row">Silent background audio <input type="checkbox" id="keepAlive" checked></label>
    <div class="actions"><button class="secondary" id="testVoice">Test voice</button></div>
  </div>

  <div class="panel" id="timer" style="margin-top:14px">
    <div id="stepName">Ready</div>
    <div id="rep"></div>
    <div id="clock">0:00</div>
    <div id="target">&nbsp;</div>
    <div id="next">&nbsp;</div>
    <div class="meta"><span id="elapsed">0:00 elapsed</span><span id="endsAt"></span></div>
    <button class="big" id="start" style="margin-top:14px">Start</button>
    <div class="controls">
      <button class="secondary" id="pause" disabled>Pause</button>
      <button class="danger" id="finish" disabled>Finish</button>
      <button class="secondary" id="lock" disabled>Lock</button>
    </div>
    <div id="status"></div>
  </div>

  <h2>Cue log</h2>
  <div class="panel"><ul id="log"><li><span class="t"></span>Cues appear here with how late each one was.</li></ul></div>

  <h2>iPhone checklist</h2>
  <div class="panel">
    <p class="sub" style="margin:0 0 4px">Results are saved per voice. Now marking: <b id="checkEngine"></b></p>
    <div id="checks"></div>
    <textarea id="notes" placeholder="Notes (iOS version, home screen or Safari, anything odd)"></textarea>
    <div class="actions">
      <button id="copy">Copy results</button>
      <button class="secondary" id="clear">Clear</button>
    </div>
  </div>
</main>

<div id="lockOverlay"><button id="unlock"><div id="unlockFill"></div><span>Hold to unlock</span></button></div>
<video id="wakeVideo" class="hidden" src="media/wake.mp4" muted playsinline loop></video>
<audio id="keepAliveAudio" src="media/keepalive.mp3" loop preload="auto"></audio>

<script type="module" src="app.js"></script>
</body>
</html>
